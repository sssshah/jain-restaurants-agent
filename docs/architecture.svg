<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1080" viewBox="0 0 920 1080" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="1080" fill="#ffffff"/>
  <text x="460" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2937">How the Jain Restaurants Agent Works</text>
  <text x="460" y="70" text-anchor="middle" font-size="15" fill="#6b7280">One restaurant at a time, checked carefully before it goes live</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <rect x="260" y="95" width="400" height="64" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="460" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a5f">1. A person suggests a restaurant</text>
  <text x="460" y="145" text-anchor="middle" font-size="13" fill="#374151">Name + city + the Jain dishes they know</text>
  <line x1="460" y1="159" x2="460" y2="183" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="260" y="186" width="400" height="64" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="460" y="213" text-anchor="middle" font-size="17" font-weight="bold" fill="#312e81">2. Find it on Google</text>
  <text x="460" y="236" text-anchor="middle" font-size="13" fill="#374151">Google Places API: address, phone, website, map pin</text>
  <line x1="460" y1="250" x2="460" y2="274" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="260" y="277" width="400" height="64" rx="12" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="460" y="304" text-anchor="middle" font-size="17" font-weight="bold" fill="#312e81">3. Is it already in the directory?</text>
  <text x="460" y="327" text-anchor="middle" font-size="13" fill="#374151">Checks the directory database (Supabase)</text>
  <rect x="688" y="283" width="210" height="52" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="793" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">If yes, closed, or</text>
  <text x="793" y="323" text-anchor="middle" font-size="12" fill="#92400e">unclear: stop + friendly note</text>
  <line x1="660" y1="309" x2="685" y2="309" stroke="#d97706" stroke-width="2"/>
  <line x1="460" y1="341" x2="460" y2="365" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="260" y="368" width="400" height="64" rx="12" fill="#dcfce7" stroke="#86efac"/>
  <text x="460" y="395" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">4. Read the menu</text>
  <text x="460" y="418" text-anchor="middle" font-size="13" fill="#374151">Visits the restaurant's own website</text>
  <line x1="460" y1="432" x2="460" y2="456" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="260" y="459" width="400" height="78" rx="12" fill="#dcfce7" stroke="#86efac"/>
  <text x="460" y="486" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">5. Decide the type</text>
  <text x="460" y="509" text-anchor="middle" font-size="13" fill="#374151">Simple Jain rules first (vegan? meat on menu?)</text>
  <text x="460" y="528" text-anchor="middle" font-size="13" fill="#374151">Hard-to-read menu? Muse Spark AI helps read it</text>
  <line x1="460" y1="537" x2="460" y2="561" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6 -->
  <rect x="260" y="564" width="400" height="64" rx="12" fill="#fae8ff" stroke="#f0abfc"/>
  <text x="460" y="591" text-anchor="middle" font-size="17" font-weight="bold" fill="#701a75">6. Build the listing</text>
  <text x="460" y="614" text-anchor="middle" font-size="13" fill="#374151">Dishes, 4-star default, notes (other locations)</text>
  <line x1="460" y1="628" x2="460" y2="652" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 7 -->
  <rect x="260" y="655" width="400" height="64" rx="12" fill="#fae8ff" stroke="#f0abfc"/>
  <text x="460" y="682" text-anchor="middle" font-size="17" font-weight="bold" fill="#701a75">7. Get the photo</text>
  <text x="460" y="705" text-anchor="middle" font-size="13" fill="#374151">From the restaurant's Google profile</text>
  <line x1="460" y1="719" x2="460" y2="743" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 8 -->
  <rect x="260" y="746" width="400" height="64" rx="12" fill="#ffe4e6" stroke="#fda4af"/>
  <text x="460" y="773" text-anchor="middle" font-size="17" font-weight="bold" fill="#881337">8. Preview, confirm, save</text>
  <text x="460" y="796" text-anchor="middle" font-size="13" fill="#374151">Saved to the directory, live on Jain Sattvik</text>

  <!-- Guardrails -->
  <rect x="160" y="850" width="600" height="118" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="6 4"/>
  <text x="460" y="880" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">Guardrails (always on)</text>
  <text x="460" y="906" text-anchor="middle" font-size="13" fill="#374151">Daily Google limits are capped - if reached: &quot;Google Quota for Map reached, try later.&quot;</text>
  <text x="460" y="928" text-anchor="middle" font-size="13" fill="#374151">Secret keys stay on this computer only - never in the code, never shared</text>
  <text x="460" y="950" text-anchor="middle" font-size="13" fill="#374151">Nothing goes live without a person confirming; unsure cases go to a human</text>

  <text x="460" y="1010" text-anchor="middle" font-size="13" fill="#6b7280">Built with: Google Places API - Supabase - Muse Spark (only for hard-to-read menus)</text>
</svg>
