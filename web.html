<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add a Restaurant - Jain Sattvik (local agent page)</title>
<style>
  body { font-family: Georgia, 'Times New Roman', serif; background:#faf7f2; color:#2b2620; margin:0; }
  .wrap { max-width: 640px; margin: 32px auto; padding: 0 16px 48px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .sub { color:#7a6a55; margin: 0 0 24px; font-size: 15px; }
  label { display:block; font-weight:bold; margin: 16px 0 6px; font-size: 15px; }
  input[type=text], textarea { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #cbbfa8; border-radius:8px; font-size:16px; background:#fff; font-family:inherit; }
  .radio { display:block; font-weight:normal; margin:6px 0; font-size:15px; }
  button { background:#b3541e; color:#fff; border:0; border-radius:8px; padding:12px 20px; font-size:16px; cursor:pointer; margin-top:20px; font-family:inherit; }
  button:disabled { opacity:.5; cursor:wait; }
  button.secondary { background:#6b5d4f; }
  .msg { border-radius:8px; padding:14px 16px; margin-top:20px; font-size:15px; line-height:1.45; }
  .msg.info { background:#fdf3e3; border:1px solid #e8cf9f; }
  .msg.ok { background:#e9f6e9; border:1px solid #a9d3a9; }
  .msg.stop { background:#fbeaea; border:1px solid #e0aaaa; }
  .card { background:#fff; border:1px solid #e2d7c3; border-radius:12px; padding:18px; margin-top:20px; }
  .card img { width:100%; border-radius:8px; margin-bottom:12px; }
  .card h2 { margin:0 0 6px; font-size:21px; }
  .card p { margin:4px 0; font-size:15px; }
  .place { border:1px solid #e2d7c3; background:#fff; border-radius:10px; padding:12px 14px; margin-top:12px; }
  .place button { margin-top:8px; padding:8px 14px; font-size:14px; }
  .log { font-family: ui-monospace, Menlo, monospace; font-size:12.5px; color:#6b5d4f; white-space:pre-wrap; margin-top:16px; }
  .badge { display:inline-block; background:#efe6d4; border-radius:20px; padding:2px 10px; font-size:13px; margin-right:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🌿 Add a Restaurant</h1>
  <p class="sub">Jain Sattvik directory - powered by your agent (local test page)</p>

  <label for="name">Restaurant name</label>
  <input type="text" id="name" placeholder="e.g. Forno Rosso">

  <label for="city">City</label>
  <input type="text" id="city" placeholder="e.g. Chicago">

  <label for="dishesText">Jain dishes you ate - what do you recommend?</label>
  <input type="text" id="dishesText" placeholder="e.g. Jain Pizza; Jain Pasta">
  <div style="text-align:center; color:#7a6a55; margin:14px 0 2px; font-size:14px;">- or choose an option -</div>
  <div id="dishOptions"></div>

  <label for="notes">Notes (optional - facts only, no opening hours)</label>
  <textarea id="notes" rows="2" placeholder="e.g. Dough is eggless, sauce is onion/garlic free"></textarea>

  <button id="runBtn">Look up &amp; preview</button>
  <div id="out"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let state = { pick: null };

fetch('/api/dish-options').then(r => r.json()).then(d => {
  $('dishOptions').innerHTML = d.options.map(o =>
    `<label class="radio"><input type="radio" name="dishopt" value="${o.code}"> ${o.label}</label>`).join('');
});

function esc(s) { return String(s == null ? '' : s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])); }

async function run(submit) {
  const typed = $('dishesText').value.trim();
  const radio = document.querySelector('input[name=dishopt]:checked');
  const dishesInput = typed || (radio ? radio.value : '');
  const payload = {
    name: $('name').value.trim(), city: $('city').value.trim(),
    dishesInput, notes: $('notes').value.trim(),
    pick: state.pick, submit: !!submit
  };
  $('runBtn').disabled = true;
  $('out').innerHTML = '<div class="msg info">Working… looking up Google, checking duplicates, fetching the menu and photo.</div>';
  try {
    const r = await fetch('/api/run', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    render(await r.json());
  } catch (e) {
    $('out').innerHTML = '<div class="msg stop">Could not reach the local agent server. Is <b>node server.js</b> still running?</div>';
  }
  $('runBtn').disabled = false;
}

function render(res) {
  const out = [];
  if (res.outcome === 'multiple') {
    out.push(`<div class="msg info">${esc(res.message)}</div>`);
    res.places.forEach((p, i) => {
      out.push(`<div class="place"><b>${i+1}. ${esc(p.name)}</b><br>${esc(p.address)}<br>Google ${esc(p.rating)} ★ (${esc(p.reviews)} reviews) - ${esc(p.type)}<br><button onclick="pick(${i+1})">Use this location</button></div>`);
    });
  } else if (res.outcome === 'preview' || res.outcome === 'submitted') {
    const L = res.listing, c = res.classification || {};
    if (res.outcome === 'submitted') out.push(`<div class="msg ok">✅ Added! ${esc(res.message)}</div>`);
    out.push('<div class="card">');
    if (res.photo && res.photo.filename) out.push(`<img src="/photos/${esc(res.photo.filename)}" alt="">`);
    out.push(`<h2>${esc(L.name)}</h2>`);
    out.push(`<p>${esc(L.address)}</p>`);
    out.push(`<p><span class="badge">${esc(L.city)}, ${esc(L.state)}</span><span class="badge">${esc(L.country)}</span><span class="badge">★★★★ ${esc(L.rating)}/5</span></p>`);
    out.push(`<p><b>Type:</b> ${esc(c.label || 'UNKNOWN - a human must decide')}</p>`);
    out.push(`<p><b>Dishes:</b> ${esc(L.liked_items || '(missing - required)')}</p>`);
    if (L.notes) out.push(`<p><b>Notes:</b> ${esc(L.notes)}</p>`);
    if (L.phone) out.push(`<p><b>Phone:</b> ${esc(L.phone)}</p>`);
    if (L.website) out.push(`<p><b>Website:</b> ${esc(L.website)}</p>`);
    out.push('</div>');
    if (res.outcome === 'preview') {
      const canSubmit = L.liked_items && c.code;
      out.push(canSubmit
        ? '<button onclick="run(true)">✓ Submit to the directory</button>'
        : '<div class="msg stop">This preview cannot be submitted yet (dishes missing or classification unknown).</div>');
    }
  } else {
    out.push(`<div class="msg stop">${esc(res.message || 'Something stopped the run.')}</div>`);
    if (res.outcome === 'duplicate' && res.places && res.places[0]) out.push(`<div class="place">Already listed: <b>${esc(res.places[0].name)}</b> - ${esc(res.places[0].address)}</div>`);
  }
  if (res.logs && res.logs.length) out.push(`<div class="log">${esc(res.logs.join('\n'))}</div>`);
  $('out').innerHTML = out.join('');
}

function pick(n) { state.pick = n; run(false); }
$('runBtn').onclick = () => { state.pick = null; run(false); };
</script>
</body>
</html>
